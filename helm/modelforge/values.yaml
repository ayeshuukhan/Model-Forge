namespace: modelforge

image:
  registry: modelforge
  tag: latest
  pullPolicy: IfNotPresent

apiGateway:
  replicas: 2
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70
  resources:
    requests: { cpu: 150m, memory: 192Mi }
    limits: { cpu: 750m, memory: 512Mi }

sentiment:
  replicas: 2
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { cpu: 500m, memory: 512Mi }

image_model:
  replicas: 1
  resources:
    requests: { cpu: 150m, memory: 256Mi }
    limits: { cpu: 750m, memory: 768Mi }

regression:
  replicas: 1
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { cpu: 500m, memory: 512Mi }

postgres:
  storage: 1Gi
  db: modelforge
  user: modelforge
  password: change-me-in-production   # override with --set or a values-secret file

redis: {}

ingress:
  host: modelforge.local
  className: nginx

grafana:
  adminPassword: admin-change-me

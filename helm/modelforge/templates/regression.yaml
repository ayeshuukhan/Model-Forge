apiVersion: apps/v1
kind: Deployment
metadata:
  name: regression-service
  namespace: {{ .Values.namespace }}
spec:
  replicas: {{ .Values.regression.replicas }}
  selector:
    matchLabels: { app: regression-service }
  template:
    metadata:
      labels: { app: regression-service }
    spec:
      containers:
        - name: regression-service
          image: "{{ .Values.image.registry }}/regression-service:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports: [{ containerPort: 8000 }]
          resources: {{ toYaml .Values.regression.resources | nindent 12 }}
          readinessProbe:
            httpGet: { path: /ready, port: 8000 }
            initialDelaySeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: 8000 }
            initialDelaySeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: regression-service
  namespace: {{ .Values.namespace }}
spec:
  selector: { app: regression-service }
  ports: [{ port: 80, targetPort: 8000 }]

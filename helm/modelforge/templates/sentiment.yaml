apiVersion: apps/v1
kind: Deployment
metadata:
  name: sentiment-service
  namespace: {{ .Values.namespace }}
spec:
  replicas: {{ .Values.sentiment.replicas }}
  selector:
    matchLabels: { app: sentiment-service }
  template:
    metadata:
      labels: { app: sentiment-service }
    spec:
      containers:
        - name: sentiment-service
          image: "{{ .Values.image.registry }}/sentiment-service:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports: [{ containerPort: 8000 }]
          resources: {{ toYaml .Values.sentiment.resources | nindent 12 }}
          readinessProbe:
            httpGet: { path: /ready, port: 8000 }
            initialDelaySeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: 8000 }
            initialDelaySeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: sentiment-service
  namespace: {{ .Values.namespace }}
spec:
  selector: { app: sentiment-service }
  ports: [{ port: 80, targetPort: 8000 }]
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: sentiment-service-hpa
  namespace: {{ .Values.namespace }}
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: sentiment-service }
  minReplicas: {{ .Values.sentiment.minReplicas }}
  maxReplicas: {{ .Values.sentiment.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: {{ .Values.sentiment.targetCPUUtilizationPercentage }} }

apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: {{ .Values.namespace }}
spec:
  replicas: {{ .Values.apiGateway.replicas }}
  selector:
    matchLabels: { app: api-gateway }
  template:
    metadata:
      labels: { app: api-gateway }
    spec:
      containers:
        - name: api-gateway
          image: "{{ .Values.image.registry }}/api-gateway:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports: [{ containerPort: 8000 }]
          envFrom:
            - configMapRef: { name: modelforge-config }
          env:
            - name: POSTGRES_USER
              valueFrom: { secretKeyRef: { name: modelforge-secret, key: POSTGRES_USER } }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: modelforge-secret, key: POSTGRES_PASSWORD } }
          resources: {{ toYaml .Values.apiGateway.resources | nindent 12 }}
          readinessProbe:
            httpGet: { path: /ready, port: 8000 }
            initialDelaySeconds: 8
          livenessProbe:
            httpGet: { path: /health, port: 8000 }
            initialDelaySeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway-service
  namespace: {{ .Values.namespace }}
spec:
  selector: { app: api-gateway }
  ports: [{ port: 80, targetPort: 8000 }]
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: api-gateway-hpa
  namespace: {{ .Values.namespace }}
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: api-gateway }
  minReplicas: {{ .Values.apiGateway.minReplicas }}
  maxReplicas: {{ .Values.apiGateway.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: {{ .Values.apiGateway.targetCPUUtilizationPercentage }} }

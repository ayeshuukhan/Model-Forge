apiVersion: apps/v1
kind: Deployment
metadata:
  name: regression-service
  namespace: modelforge
  labels:
    app: regression-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: regression-service
  template:
    metadata:
      labels:
        app: regression-service
    spec:
      containers:
        - name: regression-service
          image: modelforge/regression-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /ready
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 20
